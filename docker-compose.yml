services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RAG_DB: ${RAG_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # First-run only: creates the extra database (rag)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The agent (LangGraph). Its tools come from the MCP server, called with the end user's own JWT,
  # which the backend forwards on each request. Only reachable from other compose services.
  orchestrator:
    build:
      context: ./ai-orchestrator
    restart: unless-stopped
    environment:
      MCP_SERVER_URL: http://mcp-server:9000/mcp
      REFERENCE_DATE: ${REFERENCE_DATE:-2026-08-05}
      LLAMA_MODEL: ${LLAMA_MODEL:-gpt-oss:20b-cloud}
      LLAMA_BASE_URL: http://host.docker.internal:11434
      # LangSmith tracing (opt-in: off unless LANGSMITH_TRACING=true)
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-orchestrator}
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp-server

  # MCP server exposing the API to an AI agent as tools (streamable HTTP, /mcp).
  # Only reachable from other compose services; each request carries the end user's token.
  mcp-server:
    build:
      context: ./mcp
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      # The manuals RAG has its own database on the shared Postgres (created by the first ingest).
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${RAG_DB:-rag}
      MODEL_CACHE_DIR: /models
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "9000"
    volumes:
      - mcp_models:/models
      # Development source for `python -m app.rag.ingest --from-dir /data/manuals`
      - "./data/manuals:/data/manuals:ro"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME}
      ORCHESTRATOR_URL: http://orchestrator:8001
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - "./data:/app/data:ro"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  mcp_models:
