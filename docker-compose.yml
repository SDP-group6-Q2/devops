services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME}
      FIRST_SUPERUSER_CLIENT_NAME: ${FIRST_SUPERUSER_CLIENT_NAME}
      LLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b-cloud}
      LLAMA_BASE_URL: http://host.docker.internal:11434
      ASSISTANT_DB: assistant
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_started

  mcp-server:
    build:
      context: ./mcp-server
    image: sdp-project-mcp-server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ASSISTANT_DB: assistant
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    # No published host port -- reachable only from other containers on this
    # network (api, for /internal/*; gateway, for /mcp). See app/middleware.py's
    # own docstring: this boundary is what makes X-User-Id trustworthy at all.
    volumes:
      - ./mcp-server:/app
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: ./mcp-server
    image: sdp-project-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MCP_SERVER_URL: http://mcp-server:9000
    ports:
      - "9001:9001"
    volumes:
      - ./mcp-server:/app
    command: ["uvicorn", "app.gateway:app", "--host", "0.0.0.0", "--port", "9001"]
    depends_on:
      - mcp-server

volumes:
  db_data: